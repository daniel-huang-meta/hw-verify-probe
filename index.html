<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Coex DUT Tracker</title>
    <style>
        /* Global Styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8f9fa; color: #3c4043; }
        * { box-sizing: border-box; }
        
        /* Header & Navigation */
        .header { background-color: #ffffff; padding: 15px 30px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: #1a73e8; display: flex; align-items: center; gap: 10px; }
        .nav-tabs { display: flex; gap: 10px; }
        .tab-button { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 14px; color: #5f6368; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-button:hover { color: #1a73e8; background-color: #f1f3f4; border-radius: 4px 4px 0 0; }
        .active-tab { color: #1a73e8; border-bottom: 3px solid #1a73e8; font-weight: 600; }
        
        /* Buttons */
        .btn-primary { background-color: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1557b0; }
        .btn-secondary { background-color: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; }
        .btn-secondary:hover { background-color: #e8eaed; }
        .btn-action { background-color: #fbbc04; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-action:hover { background-color: #f2a500; }
        .btn-danger { background-color: #c5221f; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; }
        .btn-danger:hover { background-color: #b31412; }

        /* Content Area */
        .loading-bar { display: none; background-color: #e8f0fe; color: #1a73e8; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #d2e3fc; }
        .tab-content { display: none; padding: 30px; max-width: 1400px; margin: 0 auto; }
        .active-content { display: block; }

        /* Dashboard Cards */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); text-align: center; }
        .stat-card h3 { margin: 0; color: #5f6368; font-size: 16px; font-weight: 500; }
        .stat-card .number { font-size: 36px; color: #1a73e8; font-weight: bold; margin-top: 10px; }

        /* Tables */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f8f9fa; color: #5f6368; font-weight: 600; padding: 15px; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #dadce0; }
        td { padding: 12px 15px; border-bottom: 1px solid #e8eaed; font-size: 14px; vertical-align: middle; }
        tr:hover { background-color: #f8f9fa; }

        /* Badges */
        .badge { padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; text-align: center; }
        .badge-active { background-color: #e8f0fe; color: #1a73e8; }
        .badge-pending { background-color: #fef7e0; color: #b06000; }
        .badge-inprogress { background-color: #e4f7fb; color: #007b83; }
        .badge-pass { background-color: #e6f4ea; color: #137333; }
        .badge-fail { background-color: #fce8e6; color: #c5221f; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 500px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #202124; border-bottom: 1px solid #dadce0; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; color: #3c4043; font-weight: 500; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a73e8; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #dadce0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🚀 System Coex DUT Tracker</div>
        <div class="nav-tabs">
            <button class="tab-button active-tab" onclick="openTab(event, 'dashboard')">Dashboard</button>
            <button class="tab-button" onclick="openTab(event, 'registry')">DUT Registry</button>
            <button class="tab-button" onclick="openTab(event, 'tracker')">Test Tracker</button>
            <button class="tab-button" onclick="openTab(event, 'issues')">Issues</button>
        </div>
        <div>
            <button class="btn-danger" onclick="resetToken()" style="margin-right: 10px;">Reset Token</button>
            <button class="btn-primary" onclick="openAddDutModal()">+ Register New DUT</button>
        </div>
    </div>

    <div id="loading" class="loading-bar">⏳ Communicating with database, please wait...</div>

    <div id="dashboard" class="tab-content active-content">
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Total Active DUTs</h3>
                <div class="number" id="statTotalDut">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Tests Scheduled</h3>
                <div class="number" id="statTotalTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Tests Passed</h3>
                <div class="number" style="color: #137333;" id="statPassedTests">0</div>
            </div>
            <div class="stat-card">
                <h3>Tests Failed / Issues</h3>
                <div class="number" style="color: #c5221f;" id="statFailedTests">0</div>
            </div>
        </div>
    </div>

    <div id="registry" class="tab-content">
        <div class="table-container" id="registryTableContainer"></div>
    </div>

    <div id="tracker" class="tab-content">
        <div class="table-container" id="trackerTableContainer"></div>
    </div>

    <div id="issues" class="tab-content">
        <div class="table-container" id="issuesTableContainer"></div>
    </div>

    <div id="modalAddDut" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Register New DUT</div>
            <div class="form-group">
                <label>HW Build (e.g., P1, EVT)</label>
                <input type="text" id="regHwBuild" required>
            </div>
            <div class="form-group">
                <label>Config (e.g., STD, MAX)</label>
                <input type="text" id="regConfig">
            </div>
            <div class="form-group">
                <label>Loma SN</label>
                <input type="text" id="regLomaSn">
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="regNotes" rows="3"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('modalAddDut')">Cancel</button>
                <button class="btn-primary" onclick="submitNewDut()">Save & Generate Tests</button>
            </div>
        </div>
    </div>

    <div id="modalUpdateTest" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Update Test Status</div>
            <input type="hidden" id="updDutNo">
            <div class="form-group">
                <label>Victim Test</label>
                <input type="text" id="updTestName" readonly style="background-color: #f1f3f4;">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="updStatus">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Pass">Pass</option>
                    <option value="Fail">Fail</option>
                </select>
            </div>
            <div class="form-group">
                <label>Issues / Jira Link / Comments</label>
                <textarea id="updComments" rows="3"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('modalUpdateTest')">Cancel</button>
                <button class="btn-primary" onclick="submitTestUpdate()">Update Status</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SYSTEM CONFIGURATION 
        // ==========================================
        const GIST_CONFIG = {
            ID: 'YOUR_GIST_ID', // Replace with your actual Gist ID
            FILENAME: 'db.json'
        };

        // Local State Cache
        let db = { registry: [], tracker: [], victims: [], issues: [] };

        // ==========================================
        // 2. AUTHENTICATION & INITIALIZATION
        // ==========================================
        window.onload = function() {
            loadAllData();
        };

        function getGitHubToken() {
            let token = localStorage.getItem('gist_token');
            if (!token) {
                token = prompt("Please enter your GitHub Personal Access Token (PAT):");
                if (token && token.trim() !== '') {
                    localStorage.setItem('gist_token', token.trim());
                } else {
                    alert("Token is required to access the database. The page will not load correctly.");
                    return null;
                }
            }
            return token;
        }

        function resetToken() {
            localStorage.removeItem('gist_token');
            alert("Token removed. The page will reload and prompt you for a new Token.");
            location.reload();
        }

        async function loadAllData() {
            const token = getGitHubToken();
            if (!token) return;

            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_CONFIG.ID}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (response.status === 401 || response.status === 403 || response.status === 404) {
                    localStorage.removeItem('gist_token');
                    throw new Error(`Authentication failed or Gist not found. HTTP Status: ${response.status}`);
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const gist = await response.json();
                const content = gist.files[GIST_CONFIG.FILENAME].content;
                
                if (content && content.trim() !== '{}') {
                    db = JSON.parse(content);
                }

                // Ensure data arrays exist
                if (!db.registry) db.registry = [];
                if (!db.tracker) db.tracker = [];
                if (!db.victims) db.victims = [];
                if (!db.issues) db.issues = [];

                renderDashboard();
                renderRegistry();
                renderTracker();
                renderIssues();
                
            } catch (error) {
                console.error("Database connection failed:", error);
                alert("Failed to connect: " + error.message + "\n\nPlease ensure your Token is valid, has 'gist' permission, and your Gist ID is correct. Click 'Reset Token' to try again.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function syncToGist() {
            const token = localStorage.getItem('gist_token');
            if (!token) {
                alert("Session expired. Please refresh the page to enter your token.");
                return;
            }

            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_CONFIG.ID}`, {
                    method: 'PATCH',
                    headers: { 
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        files: { [GIST_CONFIG.FILENAME]: { content: JSON.stringify(db, null, 2) } }
                    })
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('gist_token');
                    alert("Token invalid or revoked. Please reset token and try again.");
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to write to database");
                }
            } catch (error) {
                console.error("Sync failed:", error);
                alert("Failed to save data. Please try again.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // ==========================================
        // 3. BUSINESS LOGIC (CRUD OPERATIONS)
        // ==========================================
        
        async function submitNewDut() {
            const hwBuild = document.getElementById('regHwBuild').value.trim();
            const config = document.getElementById('regConfig').value.trim();
            const lomaSn = document.getElementById('regLomaSn').value.trim();
            const notes = document.getElementById('regNotes').value.trim();

            if (!hwBuild) {
                alert("HW Build is required.");
                return;
            }

            // Calculate auto-increment DUT#
            let nextId = 1;
            if (db.registry.length > 0) {
                const ids = db.registry.map(d => parseInt(d['DUT#']) || 0);
                nextId = Math.max(...ids) + 1;
            }

            // Generate today's date
            const today = new Date().toISOString().split('T')[0];

            // Add to Registry
            const newDUT = {
                'DUT#': nextId,
                'Status': 'Active',
                'HW Build': hwBuild,
                'Config': config,
                'Loma SN': lomaSn,
                'Date Registered': today,
                'Notes': notes
            };
            db.registry.push(newDUT);

            // Automatically generate tests based on Victim Config
            if (db.victims.length > 0) {
                db.victims.forEach(v => {
                    const testName = v['Victim Test Name'] || v['name'] || v['Victim Test'] || 'Unknown Test';
                    db.tracker.push({
                        'DUT#': nextId,
                        'Victim Test': testName,
                        'HW Build': hwBuild,
                        'Config': config,
                        'Status': 'Pending',
                        'Date': '',
                        'Issues': ''
                    });
                });
            } else {
                alert("Warning: No victim configurations found. Tests were not automatically generated.");
            }

            closeModal('modalAddDut');
            await syncToGist();
            alert(`Success! DUT #${nextId} registered and tests scheduled.`);
            
            // Refresh UI
            renderDashboard();
            renderRegistry();
            renderTracker();
        }

        async function submitTestUpdate() {
            const dutNo = document.getElementById('updDutNo').value;
            const testName = document.getElementById('updTestName').value;
            const status = document.getElementById('updStatus').value;
            const comments = document.getElementById('updComments').value;

            // Find the exact test record
            const testIndex = db.tracker.findIndex(t => String(t['DUT#']) === String(dutNo) && t['Victim Test'] === testName);
            
            if (testIndex !== -1) {
                db.tracker[testIndex]['Status'] = status;
                db.tracker[testIndex]['Issues'] = comments;
                db.tracker[testIndex]['Date'] = new Date().toISOString().split('T')[0];
                
                // If status is fail, automatically log it to Issues table
                if (status === 'Fail') {
                    db.issues.push({
                        'Issue ID': 'ISSUE-' + Date.now().toString().slice(-6),
                        'DUT#': dutNo,
                        'Victim Test': testName,
                        'Description': comments || 'Failed test during execution',
                        'Status': 'Open',
                        'Date Logged': new Date().toISOString().split('T')[0]
                    });
                }

                closeModal('modalUpdateTest');
                await syncToGist();
                alert(`Success! Test status updated.`);
                
                // Refresh UI
                renderDashboard();
                renderTracker();
                renderIssues();
            } else {
                alert("Error: Test record not found in database.");
            }
        }

        // ==========================================
        // 4. UI RENDERING & HELPERS
        // ==========================================

        function getStatusBadge(status) {
            const s = (status || '').toString().toLowerCase().trim();
            if (s === 'active' || s === 'open') return `<span class="badge badge-active">${status}</span>`;
            if (s === 'pending') return `<span class="badge badge-pending">${status}</span>`;
            if (s === 'in progress') return `<span class="badge badge-inprogress">${status}</span>`;
            if (s === 'pass' || s === 'passed' || s === 'closed') return `<span class="badge badge-pass">${status}</span>`;
            if (s === 'fail' || s === 'failed') return `<span class="badge badge-fail">${status}</span>`;
            return `<span class="badge" style="background:#eee; color:#333;">${status || 'N/A'}</span>`;
        }

        function renderDashboard() {
            document.getElementById('statTotalDut').innerText = db.registry.length;
            document.getElementById('statTotalTests').innerText = db.tracker.length;
            
            const passCount = db.tracker.filter(t => (t['Status'] || '').toLowerCase() === 'pass').length;
            const failCount = db.tracker.filter(t => (t['Status'] || '').toLowerCase() === 'fail').length;
            
            document.getElementById('statPassedTests').innerText = passCount;
            document.getElementById('statFailedTests').innerText = failCount;
        }

        function renderRegistry() {
            let html = `<table>
                <thead>
                    <tr>
                        <th>DUT#</th>
                        <th>Status</th>
                        <th>HW Build</th>
                        <th>Config</th>
                        <th>Loma SN</th>
                        <th>Date Registered</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>`;
            
            // Render from newest to oldest
            const dataReversed = [...db.registry].reverse();
            
            if (dataReversed.length === 0) {
                html += `<tr><td colspan="7" style="text-align:center;">No DUTs registered yet.</td></tr>`;
            } else {
                dataReversed.forEach(d => {
                    html += `<tr>
                        <td><b>${d['DUT#'] || ''}</b></td>
                        <td>${getStatusBadge(d['Status'])}</td>
                        <td>${d['HW Build'] || ''}</td>
                        <td>${d['Config'] || ''}</td>
                        <td>${d['Loma SN'] || ''}</td>
                        <td>${d['Date Registered'] || ''}</td>
                        <td>${d['Notes'] || ''}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            document.getElementById('registryTableContainer').innerHTML = html;
        }

        function renderTracker() {
            let html = `<table>
                <thead>
                    <tr>
                        <th>DUT#</th>
                        <th>Victim Test</th>
                        <th>Status</th>
                        <th>HW Build</th>
                        <th>Date Updated</th>
                        <th>Issues / Comments</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>`;

            // Render from newest to oldest
            const dataReversed = [...db.tracker].reverse();

            if (dataReversed.length === 0) {
                html += `<tr><td colspan="7" style="text-align:center;">No tests scheduled yet.</td></tr>`;
            } else {
                dataReversed.forEach(t => {
                    const dutNo = t['DUT#'] || '';
                    const testName = t['Victim Test'] || '';
                    const safeTestName = testName.replace(/'/g, "\\'"); 
                    
                    html += `<tr>
                        <td><b>${dutNo}</b></td>
                        <td>${testName}</td>
                        <td>${getStatusBadge(t['Status'])}</td>
                        <td>${t['HW Build'] || ''}</td>
                        <td>${t['Date'] || ''}</td>
                        <td style="color: #c5221f; font-size: 13px; max-width: 250px;">${t['Issues'] || ''}</td>
                        <td>
                            <button class="btn-action" onclick="openUpdateModal('${dutNo}', '${safeTestName}')">Update</button>
                        </td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            document.getElementById('trackerTableContainer').innerHTML = html;
        }

        function renderIssues() {
            let html = `<table>
                <thead>
                    <tr>
                        <th>Issue ID</th>
                        <th>DUT#</th>
                        <th>Victim Test</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Date Logged</th>
                    </tr>
                </thead>
                <tbody>`;

            const dataReversed = [...db.issues].reverse();

            if (dataReversed.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center;">No issues logged.</td></tr>`;
            } else {
                dataReversed.forEach(i => {
                    html += `<tr>
                        <td><b>${i['Issue ID'] || ''}</b></td>
                        <td>${i['DUT#'] || ''}</td>
                        <td>${i['Victim Test'] || ''}</td>
                        <td>${i['Description'] || ''}</td>
                        <td>${getStatusBadge(i['Status'])}</td>
                        <td>${i['Date Logged'] || ''}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            document.getElementById('issuesTableContainer').innerHTML = html;
        }

        // ==========================================
        // 5. EVENT LISTENERS & MODAL CONTROLS
        // ==========================================

        function openTab(evt, tabName) {
            const tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active-content");
            }
            
            const tablinks = document.getElementsByClassName("tab-button");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active-tab", "");
            }
            
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active-content");
            evt.currentTarget.className += " active-tab";
        }

        function openAddDutModal() {
            document.getElementById('regHwBuild').value = '';
            document.getElementById('regConfig').value = '';
            document.getElementById('regLomaSn').value = '';
            document.getElementById('regNotes').value = '';
            
            document.getElementById('modalAddDut').style.display = 'flex';
        }

        function openUpdateModal(dutNo, testName) {
            const test = db.tracker.find(t => String(t['DUT#']) === String(dutNo) && t['Victim Test'] === testName);
            
            document.getElementById('updDutNo').value = dutNo;
            document.getElementById('updTestName').value = testName;
            
            if (test) {
                let status = test['Status'];
                if (!['Pending', 'In Progress', 'Pass', 'Fail'].includes(status)) status = 'Pending';
                document.getElementById('updStatus').value = status;
                document.getElementById('updComments').value = test['Issues'] || '';
            } else {
                document.getElementById('updStatus').value = 'Pending';
                document.getElementById('updComments').value = '';
            }
            
            document.getElementById('modalUpdateTest').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

    </script>
</body>
</html>
